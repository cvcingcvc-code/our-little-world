<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Our Little World · 导航预览</title><style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 85%,#211c43,#080c20 65%);color:#fce5f0;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:16px} main{text-align:center;width:min(100%,620px)} h1{font-family:Georgia,serif;font-weight:400;font-size:32px} p{color:#beb2d2;font-size:14px} .nav{display:flex;justify-content:center;gap:3px;padding:9px 8px;background:#17162c;border:1px solid #54415d;border-radius:28px;box-shadow:0 12px 36px #0005;max-width:100%;margin:36px auto 0;width:max-content} .nav-item{position:relative;min-width:0;width:56px;min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;border-radius:18px;background:transparent;color:#d2c4e1;cursor:pointer;font:inherit;font-size:11px;white-space:nowrap;transition:background .2s,transform .2s,color .2s} .nav-item img{width:32px;height:32px;opacity:.77;transition:transform .25s,opacity .25s} .nav-item.active{background:linear-gradient(145deg,#f5a6c32c,#a68de427);border-color:#efa6c95a;color:#ffdbeb;box-shadow:0 0 16px #f293bc18} .nav-item.active img{opacity:1;transform:translateY(-2px) scale(1.09)} .nav-item:hover img{opacity:1;transform:translateY(-3px)} .nav-item:active{transform:scale(.94)} .nav-item:focus-visible{outline:2px solid #ffd1e6;outline-offset:2px} @media(max-width:390px){.nav{gap:1px;padding:7px 4px}.nav-item{width:46px}.nav-item img{width:29px;height:29px}} @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main><h1>Our Little World</h1><p>把每一件小事，收藏成我们的星光。</p><nav class="nav" aria-label="纪念馆导航"><button type="button" class="nav-item active" aria-pressed="true" data-name="home"><img src="home.svg" alt=""><span>首页</span></button><button type="button" class="nav-item" aria-pressed="false" data-name="album"><img src="album.svg" alt=""><span>相册</span></button><button type="button" class="nav-item" aria-pressed="false" data-name="stars"><img src="stars.svg" alt=""><span>星空</span></button><button type="button" class="nav-item" aria-pressed="false" data-name="food"><img src="food.svg" alt=""><span>美食</span></button><button type="button" class="nav-item" aria-pressed="false" data-name="wishes"><img src="wishes.svg" alt=""><span>愿望</span></button><button type="button" class="nav-item" aria-pressed="false" data-name="gift"><img src="gift.svg" alt=""><span>礼物</span></button></nav><p id="status" aria-live="polite">当前：首页 · 点击图标体验选中状态</p></main><script>document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});document.querySelector('#status').textContent='当前：'+b.innerText+' · 样式演示'}));</script></html>
